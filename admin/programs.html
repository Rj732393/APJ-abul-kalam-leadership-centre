<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programmes - Kalam Centre Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<script src="js/authGuard.js"></script>
</head>
<body>

<aside class="sidebar">
  <div class="brand">Kalam Centre<br><span>Admin Panel</span></div>
  <nav>
    <a href="index.html">📊 Dashboard</a>
    <a href="settings.html">⚙️ Site Settings</a>
    <a href="board.html">👥 Advisory Board</a>
    <a href="gallery.html">🖼️ Gallery</a>
    <a href="news.html">📰 News</a>
    <a href="programs.html" class="active">🎯 Programmes</a>
  </nav>
  <div class="foot">© 2026 Kalam Centre Admin</div>
</aside>

<div class="main">
  <div class="topbar">
    <button id="menuToggle" class="btn btn-ghost btn-sm" style="display:none;">☰</button>
    <h1>Programmes</h1>
    <span class="badge" id="countBadge">0 programmes</span>
  </div>

  <div class="content">
    <div id="msg" class="msg"></div>

    <div class="card">
      <h2 id="formTitle">Add Programme</h2>
      <form id="progForm">
        <input type="hidden" id="itemId">
        <div class="form-grid">
          <div>
            <label>Stage Label</label>
            <input type="text" id="stage" placeholder="e.g. STAGE 01">
          </div>
          <div>
            <label>Sort Order</label>
            <input type="number" id="sort_order" value="0">
          </div>
        </div>
        <label>Title</label>
        <input type="text" id="title" required>
        <label>Description</label>
        <textarea id="description" style="min-height:110px;"></textarea>
        <div class="actions">
          <button type="submit" class="btn btn-primary">Save Programme</button>
          <button type="button" id="cancelEdit" class="btn btn-ghost" style="display:none;">Cancel</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>All Programmes</h2>
      <table>
        <thead>
          <tr><th>Stage</th><th>Title</th><th>Order</th><th>Actions</th></tr>
        </thead>
        <tbody id="itemTable"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  const form = document.getElementById('progForm');

  async function loadItems() {
    try {
      const items = await apiRequest('/api/programs');
      document.getElementById('countBadge').textContent = items.length + ' programmes';
      const tbody = document.getElementById('itemTable');
      tbody.innerHTML = items.map(p => `
        <tr>
          <td><span class="tag">${p.stage || ''}</span></td>
          <td>${p.title}</td>
          <td>${p.sort_order}</td>
          <td>
            <button class="btn btn-ghost btn-sm" onclick='editItem(${JSON.stringify(p)})'>Edit</button>
            <button class="btn btn-red btn-sm" onclick="deleteItem(${p.id})">Delete</button>
          </td>
        </tr>
      `).join('');
    } catch (err) {
      showMsg('msg', err.message, 'error');
    }
  }

  function editItem(p) {
    document.getElementById('formTitle').textContent = 'Edit Programme';
    document.getElementById('itemId').value = p.id;
    document.getElementById('stage').value = p.stage || '';
    document.getElementById('sort_order').value = p.sort_order;
    document.getElementById('title').value = p.title;
    document.getElementById('description').value = p.description || '';
    document.getElementById('cancelEdit').style.display = 'inline-flex';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.getElementById('cancelEdit').addEventListener('click', resetForm);

  function resetForm() {
    form.reset();
    document.getElementById('itemId').value = '';
    document.getElementById('formTitle').textContent = 'Add Programme';
    document.getElementById('cancelEdit').style.display = 'none';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('itemId').value;
    const body = {
      stage: document.getElementById('stage').value,
      title: document.getElementById('title').value,
      description: document.getElementById('description').value,
      sort_order: document.getElementById('sort_order').value
    };
    try {
      if (id) {
        await apiRequest('/api/programs/' + id, 'PUT', body);
        showMsg('msg', 'Programme update ho gaya ✅', 'success');
      } else {
        await apiRequest('/api/programs', 'POST', body);
        showMsg('msg', 'Programme add ho gaya ✅', 'success');
      }
      resetForm();
      loadItems();
    } catch (err) {
      showMsg('msg', err.message, 'error');
    }
  });

  async function deleteItem(id) {
    if (!confirm('Pakka delete karna hai?')) return;
    try {
      await apiRequest('/api/programs/' + id, 'DELETE');
      showMsg('msg', 'Programme delete ho gaya ✅', 'success');
      loadItems();
    } catch (err) {
      showMsg('msg', err.message, 'error');
    }
  }

  loadItems();
</script>

</body>
</html>
