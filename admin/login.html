<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - APJ Abdul Kalam Centre</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
  }
  .card {
    background: #ffffff;
    padding: 40px 36px;
    border-radius: 10px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .card h1 {
    font-size: 22px;
    margin-bottom: 24px;
    color: #0f172a;
    text-align: center;
  }
  label {
    display: block;
    font-size: 13px;
    color: #334155;
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 14px;
  }
  input:focus { outline: none; border-color: #0f172a; }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 11px;
    background: #0f172a;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
  }
  button:hover { background: #1e293b; }
  #msg {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
  }
  .error { color: #dc2626; }
  .success { color: #16a34a; }
</style>
</head>
<body>

  <div class="card">
    <h1>Admin Login</h1>
    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" required>

      <button type="submit">Login</button>
      <div id="msg"></div>
    </form>
  </div>

<script>
  const API_URL = 'http://localhost:5000/api/auth/login';

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('msg');
    msg.textContent = '';

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (!res.ok) {
        msg.textContent = data.error || 'Login fail ho gaya';
        msg.className = 'error';
        return;
      }

      // token save karo taaki baaki admin pages me use ho sake
      localStorage.setItem('adminToken', data.token);
      localStorage.setItem('adminUsername', data.username);

      msg.textContent = 'Login successful ✅';
      msg.className = 'success';

      // yaha apne admin dashboard page ka naam daal do
      window.location.href = 'index.html';

    } catch (err) {
      msg.textContent = 'Server se connect nahi ho paya';
      msg.className = 'error';
    }
  });
</script>

</body>
</html>
