<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - Kalam Centre Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<script src="js/authGuard.js"></script>
</head>
<body>

<aside class="sidebar">
  <div class="brand">Kalam Centre<br><span>Admin Panel</span></div>
  <nav>
    <a href="index.html">📊 Dashboard</a>
    <a href="settings.html">⚙️ Site Settings</a>
    <a href="board.html">👥 Advisory Board</a>
    <a href="gallery.html" class="active">🖼️ Gallery</a>
    <a href="news.html">📰 News</a>
    <a href="programs.html">🎯 Programmes</a>
  </nav>
  <div class="foot">© 2026 Kalam Centre Admin</div>
</aside>

<div class="main">
  <div class="topbar">
    <button id="menuToggle" class="btn btn-ghost btn-sm" style="display:none;">☰</button>
    <h1>Gallery</h1>
    <span class="badge" id="countBadge">0 photos</span>
  </div>

  <div class="content">
    <div id="msg" class="msg"></div>

    <div class="card">
      <h2 id="formTitle">Add New Photo</h2>
      <form id="galleryForm">
        <input type="hidden" id="itemId">
        <div class="form-grid">
          <div>
            <label>Caption</label>
            <input type="text" id="caption" placeholder="e.g. Fellowship Cohort · Patna">
          </div>
          <div>
            <label>Category</label>
            <select id="category">
              <option value="">— None —</option>
              <option value="fellowship">Fellowship</option>
              <option value="voter-drives">Voter Drives</option>
              <option value="community-labs">Community Labs</option>
              <option value="campus-workshops">Campus Workshops</option>
            </select>
          </div>
          <div>
            <label>Color Tint</label>
            <select id="tint">
              <option value="tint-navy">Navy</option>
              <option value="tint-red">Red</option>
              <option value="tint-teal">Teal</option>
              <option value="tint-gold">Gold</option>
              <option value="tint-violet">Violet</option>
            </select>
          </div>
          <div>
            <label>Sort Order</label>
            <input type="number" id="sort_order" value="0">
          </div>
          <div>
            <label>Photo <span id="photoRequired" style="color:var(--red)">*</span></label>
            <input type="file" id="image" accept="image/*">
            <img id="imgPreview" class="img-preview">
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary">Save Photo</button>
          <button type="button" id="cancelEdit" class="btn btn-ghost" style="display:none;">Cancel</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>All Photos</h2>
      <table>
        <thead>
          <tr><th>Photo</th><th>Caption</th><th>Category</th><th>Tint</th><th>Order</th><th>Actions</th></tr>
        </thead>
        <tbody id="itemTable"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  const form = document.getElementById('galleryForm');
  const imageInput = document.getElementById('image');
  const imgPreview = document.getElementById('imgPreview');

  const CATEGORY_LABELS = {
    'fellowship': 'Fellowship',
    'voter-drives': 'Voter Drives',
    'community-labs': 'Community Labs',
    'campus-workshops': 'Campus Workshops'
  };

  imageInput.addEventListener('change', () => {
    const file = imageInput.files[0];
    if (file) {
      imgPreview.src = URL.createObjectURL(file);
      imgPreview.style.display = 'block';
    }
  });

  async function loadItems() {
    try {
      const items = await apiRequest('/api/gallery');
      document.getElementById('countBadge').textContent = items.length + ' photos';
      const tbody = document.getElementById('itemTable');
      tbody.innerHTML = items.map(g => `
        <tr>
          <td><img class="table-thumb" src="${imgUrl(g.image)}"></td>
          <td>${g.caption || ''}</td>
          <td><span class="tag">${CATEGORY_LABELS[g.category] || '—'}</span></td>
          <td><span class="tag">${g.tint}</span></td>
          <td>${g.sort_order}</td>
          <td>
            <button class="btn btn-ghost btn-sm" onclick='editItem(${JSON.stringify(g)})'>Edit</button>
            <button class="btn btn-red btn-sm" onclick="deleteItem(${g.id})">Delete</button>
          </td>
        </tr>
      `).join('');
    } catch (err) {
      showMsg('msg', err.message, 'error');
    }
  }

  function editItem(g) {
    document.getElementById('formTitle').textContent = 'Edit Photo';
    document.getElementById('itemId').value = g.id;
    document.getElementById('caption').value = g.caption || '';
    document.getElementById('category').value = g.category || '';
    document.getElementById('tint').value = g.tint;
    document.getElementById('sort_order').value = g.sort_order;
    document.getElementById('photoRequired').style.display = 'none';
    imgPreview.src = imgUrl(g.image);
    imgPreview.style.display = 'block';
    document.getElementById('cancelEdit').style.display = 'inline-flex';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.getElementById('cancelEdit').addEventListener('click', resetForm);

  function resetForm() {
    form.reset();
    document.getElementById('itemId').value = '';
    document.getElementById('formTitle').textContent = 'Add New Photo';
    document.getElementById('cancelEdit').style.display = 'none';
    document.getElementById('photoRequired').style.display = 'inline';
    imgPreview.style.display = 'none';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('itemId').value;
    if (!id && !imageInput.files[0]) {
      showMsg('msg', 'Photo upload karna zaroori hai', 'error');
      return;
    }
    const fd = new FormData();
    fd.append('caption', document.getElementById('caption').value);
    fd.append('category', document.getElementById('category').value);
    fd.append('tint', document.getElementById('tint').value);
    fd.append('sort_order', document.getElementById('sort_order').value);
    if (imageInput.files[0]) fd.append('image', imageInput.files[0]);

    try {
      if (id) {
        await apiUpload('/api/gallery/' + id, 'PUT', fd);
        showMsg('msg', 'Photo update ho gayi ✅', 'success');
      } else {
        await apiUpload('/api/gallery', 'POST', fd);
        showMsg('msg', 'Photo upload ho gayi ✅', 'success');
      }
      resetForm();
      loadItems();
    } catch (err) {
      showMsg('msg', err.message, 'error');
    }
  });

  async function deleteItem(id) {
    if (!confirm('Pakka delete karna hai?')) return;
    try {
      await apiRequest('/api/gallery/' + id, 'DELETE');
      showMsg('msg', 'Photo delete ho gayi ✅', 'success');
      loadItems();
    } catch (err) {
      showMsg('msg', err.message, 'error');
    }
  }

  loadItems();
</script>

</body>
</html>
