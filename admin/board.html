<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advisory Board - Kalam Centre Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<script src="js/authGuard.js"></script>
</head>
<body>

<aside class="sidebar">
  <div class="brand">Kalam Centre<br><span>Admin Panel</span></div>
  <nav>
    <a href="index.html">📊 Dashboard</a>
    <a href="settings.html">⚙️ Site Settings</a>
    <a href="board.html" class="active">👥 Advisory Board</a>
    <a href="gallery.html">🖼️ Gallery</a>
    <a href="news.html">📰 News</a>
    <a href="programs.html">🎯 Programmes</a>
  </nav>
  <div class="foot">© 2026 Kalam Centre Admin</div>
</aside>

<div class="main">
  <div class="topbar">
    <button id="menuToggle" class="btn btn-ghost btn-sm" style="display:none;">☰</button>
    <h1>Advisory Board</h1>
    <span class="badge" id="countBadge">0 members</span>
  </div>

  <div class="content">
    <div id="msg" class="msg"></div>

    <div class="card">
      <h2 id="formTitle">Add New Member</h2>
      <form id="memberForm">
        <input type="hidden" id="memberId">
        <div class="form-grid">
          <div>
            <label>Name</label>
            <input type="text" id="name" required>
          </div>
          <div>
            <label>Role / Designation</label>
            <input type="text" id="role">
          </div>
          <div>
            <label>Sort Order</label>
            <input type="number" id="sort_order" value="0">
          </div>
          <div>
            <label>Photo</label>
            <input type="file" id="photo" accept="image/*">
            <img id="photoPreview" class="img-preview">
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary">Save Member</button>
          <button type="button" id="cancelEdit" class="btn btn-ghost" style="display:none;">Cancel</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>All Members</h2>
      <table>
        <thead>
          <tr><th>Photo</th><th>Name</th><th>Role</th><th>Order</th><th>Actions</th></tr>
        </thead>
        <tbody id="memberTable"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  const form = document.getElementById('memberForm');
  const photoInput = document.getElementById('photo');
  const photoPreview = document.getElementById('photoPreview');

  photoInput.addEventListener('change', () => {
    const file = photoInput.files[0];
    if (file) {
      photoPreview.src = URL.createObjectURL(file);
      photoPreview.style.display = 'block';
    }
  });

  async function loadMembers() {
    try {
      const members = await apiRequest('/api/board');
      document.getElementById('countBadge').textContent = members.length + ' members';
      const tbody = document.getElementById('memberTable');
      tbody.innerHTML = members.map(m => `
        <tr>
          <td>${m.photo ? `<img class="table-thumb" src="${imgUrl(m.photo)}">` : '—'}</td>
          <td>${m.name}</td>
          <td>${m.role || ''}</td>
          <td>${m.sort_order}</td>
          <td>
            <button class="btn btn-ghost btn-sm" onclick='editMember(${JSON.stringify(m)})'>Edit</button>
            <button class="btn btn-red btn-sm" onclick="deleteMember(${m.id})">Delete</button>
          </td>
        </tr>
      `).join('');
    } catch (err) {
      showMsg('msg', err.message, 'error');
    }
  }

  function editMember(m) {
    document.getElementById('formTitle').textContent = 'Edit Member';
    document.getElementById('memberId').value = m.id;
    document.getElementById('name').value = m.name;
    document.getElementById('role').value = m.role || '';
    document.getElementById('sort_order').value = m.sort_order;
    if (m.photo) {
      photoPreview.src = imgUrl(m.photo);
      photoPreview.style.display = 'block';
    }
    document.getElementById('cancelEdit').style.display = 'inline-flex';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.getElementById('cancelEdit').addEventListener('click', resetForm);

  function resetForm() {
    form.reset();
    document.getElementById('memberId').value = '';
    document.getElementById('formTitle').textContent = 'Add New Member';
    document.getElementById('cancelEdit').style.display = 'none';
    photoPreview.style.display = 'none';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('memberId').value;
    const fd = new FormData();
    fd.append('name', document.getElementById('name').value);
    fd.append('role', document.getElementById('role').value);
    fd.append('sort_order', document.getElementById('sort_order').value);
    if (photoInput.files[0]) fd.append('photo', photoInput.files[0]);

    try {
      if (id) {
        await apiUpload('/api/board/' + id, 'PUT', fd);
        showMsg('msg', 'Member update ho gaya ✅', 'success');
      } else {
        await apiUpload('/api/board', 'POST', fd);
        showMsg('msg', 'Member add ho gaya ✅', 'success');
      }
      resetForm();
      loadMembers();
    } catch (err) {
      showMsg('msg', err.message, 'error');
    }
  });

  async function deleteMember(id) {
    if (!confirm('Pakka delete karna hai?')) return;
    try {
      await apiRequest('/api/board/' + id, 'DELETE');
      showMsg('msg', 'Member delete ho gaya ✅', 'success');
      loadMembers();
    } catch (err) {
      showMsg('msg', err.message, 'error');
    }
  }

  loadMembers();
</script>

</body>
</html>
